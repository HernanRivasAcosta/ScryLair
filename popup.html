<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; margin: 0; padding: 12px 14px; width: 210px; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: flex; align-items: center; gap: 6px; margin: 6px 0; cursor: pointer; }
    hr { border: none; border-top: 1px solid #ddd; margin: 10px 0; }
    button { font: inherit; padding: 3px 8px; cursor: pointer; }
    #status { color: #666; font-size: 11px; margin-left: 6px; }
  </style>
</head>
<body>
  <h1>Scrylair</h1>
  <label><input type="checkbox" id="excludeUB"> Exclude UB printings</label>
  <hr>
  <label><input type="checkbox" id="usd"> Show USD</label>
  <label><input type="checkbox" id="eur"> Show EUR</label>
  <hr>
  <button id="clear">Clear price cache</button><span id="status"></span>
  <script src="popup.js"></script>
</body>
</html>
